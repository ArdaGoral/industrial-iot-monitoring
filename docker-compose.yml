# Faz 4 - veri altyapısı
#
#   ESP32 (QEMU) --MQTT--> mosquitto --> backend --> influxdb
#                                          |
#                          dashboard <-- REST + WebSocket
#
# Başlatmak:   docker compose up -d --build
# Durdurmak:   docker compose down          (veriler volume'da kalır)
# Sıfırlamak:  docker compose down -v       (veritabanı dahil HER ŞEYİ siler)
#
# Şifre ve token aşağıda varsayılan değerlerle duruyor; sadece yerel geliştirme içindir.
# Değiştirmek için proje köküne .env dosyası koyup aynı isimli değişkenleri yaz.

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: iiot-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    restart: unless-stopped

  influxdb:
    image: influxdb:2.7
    container_name: iiot-influxdb
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_USER:-admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASSWORD:-admin12345}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG:-factory}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET:-telemetry}
      DOCKER_INFLUXDB_INIT_RETENTION: 30d
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN:-dev-token-degistir}
    volumes:
      - influxdb-data:/var/lib/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: iiot-backend
    ports:
      - "8000:8000"
    environment:
      MQTT_HOST: mosquitto          # aynı Docker ağında servis adı = host adı
      MQTT_PORT: "1883"
      TOPIC_BASE: factory/motor1
      INFLUX_URL: http://influxdb:8086
      INFLUX_ORG: ${INFLUX_ORG:-factory}
      INFLUX_BUCKET: ${INFLUX_BUCKET:-telemetry}
      INFLUX_TOKEN: ${INFLUX_TOKEN:-dev-token-degistir}
    depends_on:
      mosquitto:
        condition: service_started
      influxdb:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mosquitto-data:
  influxdb-data:
