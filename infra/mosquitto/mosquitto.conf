# Mosquitto 2.x varsayılan olarak sadece kendi makinesinden bağlantı kabul eder.
# Container içinde çalıştığı için dışarıya (Mac'e, QEMU'ya) açıkça izin veriyoruz.
listener 1883 0.0.0.0

# Yerel geliştirme: kullanıcı adı/şifre yok.
# Gerçek sahada: password_file + TLS (listener 8883) kullanılmalı.
allow_anonymous true

# Retained mesajlar (gateway/plc durumu) container yeniden başlayınca kaybolmasın
persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
